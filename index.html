<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicken Shop Finder</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root{
    --ink:#14191F; --surface:#1E252E; --line:#323C48;
    --paper:#EFF1EE; --text-hi:#F4F5F2; --text-mid:#A9B2BC;
    --accent:#E8A33D; --route:#4FC3D9; --good:#4C9A6A; --bad:#B5493B;
    --f-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --f-mono:'Courier New',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ink); color:var(--text-hi);
    font-family:var(--f-body); font-size:15px;
  }
  header{
    padding:16px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  header h1{font-size:17px; margin:0;}
  header .sub{font-size:12px; color:var(--text-mid); margin-top:2px;}

  .controls{
    display:flex; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line);
    align-items:center; flex-wrap:wrap; background:var(--surface);
  }
  button{
    font-family:inherit; font-size:13px; font-weight:600; border:none;
    border-radius:8px; padding:10px 16px; cursor:pointer;
  }
  #btn-locate{background:var(--accent); color:#3A2708;}
  #btn-scan{background:var(--text-hi); color:var(--ink);}
  #btn-route{background:var(--route); color:#0A2E33;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  select{
    font-family:var(--f-mono); font-size:13px; background:var(--ink); color:var(--text-hi);
    border:1px solid var(--line); border-radius:6px; padding:9px 10px;
  }
  #status{font-size:12px; color:var(--text-mid); margin-left:auto;}

  .layout{display:flex; height:calc(100vh - 128px); min-height:500px;}
  #map{flex:1.3; background:#ddd;}
  #panel{
    flex:1; overflow-y:auto; border-left:1px solid var(--line);
    background:var(--surface); padding:14px;
  }
  #panel h2{font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-mid); margin:4px 0 10px;}

  .shop-row{
    display:flex; align-items:center; gap:10px; padding:9px 6px;
    border-bottom:1px solid var(--line);
  }
  .shop-row input[type=checkbox]{width:16px; height:16px; flex-shrink:0;}
  .shop-name{font-size:13px; font-weight:600;}
  .shop-meta{font-family:var(--f-mono); font-size:11px; color:var(--text-mid); margin-top:2px;}
  .shop-dist{margin-left:auto; font-family:var(--f-mono); font-size:12px; color:var(--accent); white-space:nowrap;}

  #route-summary{
    display:none; background:var(--ink); border:1px solid var(--line); border-radius:10px;
    padding:12px; margin-top:14px; font-size:13px;
  }
  #route-summary.show{display:block;}
  #route-summary .stat{font-family:var(--f-mono); color:var(--route); font-weight:600;}
  #route-stops{margin-top:10px; padding-left:18px; font-size:12.5px; line-height:1.8;}
  #gmaps-link{
    display:inline-block; margin-top:10px; background:var(--good); color:#fff;
    text-decoration:none; padding:8px 14px; border-radius:8px; font-size:12.5px; font-weight:600;
  }
  .empty{color:var(--text-mid); font-size:13px; padding:20px 6px;}

  @media (max-width:800px){
    .layout{flex-direction:column; height:auto;}
    #map{height:340px;}
    #panel{max-height:60vh;}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Chicken Shop Finder</h1>
    <div class="sub">Nothing is saved — this runs only in your browser, per session.</div>
  </div>
</header>

<div class="controls">
  <button id="btn-locate">📍 Use My Location</button>
  <select id="radius">
    <option value="500">500 m</option>
    <option value="1000" selected>1 km</option>
    <option value="2000">2 km</option>
    <option value="5000">5 km</option>
  </select>
  <button id="btn-scan" disabled>🔍 Scan Area</button>
  <button id="btn-route" disabled>🧭 Optimize Route</button>
  <span id="status">Tap "Use My Location" to start</span>
</div>

<div class="layout">
  <div id="map"></div>
  <div id="panel">
    <h2>Nearby shops</h2>
    <div id="shop-list"><div class="empty">Scan an area to see results here.</div></div>
    <div id="route-summary">
      <div><span class="stat" id="rt-dist"></span> · <span class="stat" id="rt-time"></span></div>
      <ol id="route-stops"></ol>
      <a id="gmaps-link" href="#" target="_blank" rel="noopener">Open in Google Maps →</a>
    </div>
  </div>
</div>

<script>
/* ---------- CONFIG — tweak these if you want ---------- */
const OVERPASS_URL = 'https://overpass-api.de/api/interpreter';
const OSRM_TRIP_URL = 'https://router.project-osrm.org/trip/v1/driving/';
// Regex used to match shop name/tags. Edit for your region/language as needed.
const NAME_MATCH = 'chicken|poultry|murgi|meat';

/* ---------- STATE ---------- */
let map, userMarker, userLoc = null;
let shopMarkers = [];
let shops = [];          // all shops found in last scan
let routeLine = null;

/* ---------- MAP INIT ---------- */
map = L.map('map').setView([19.0760, 72.8777], 12); // default: generic India view until located
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

const userIcon = L.divIcon({className:'', html:'<div style="width:16px;height:16px;border-radius:50%;background:#4FC3D9;border:3px solid #0A2E33;"></div>', iconSize:[16,16]});
const shopIcon = L.divIcon({className:'', html:'<div style="width:14px;height:14px;border-radius:50% 50% 50% 0;background:#E8A33D;border:2px solid #3A2708;transform:rotate(-45deg);"></div>', iconSize:[14,14]});

/* ---------- STATUS HELPER ---------- */
function setStatus(msg){ document.getElementById('status').textContent = msg; }

/* ---------- STEP 1: GEOLOCATION ---------- */
document.getElementById('btn-locate').addEventListener('click', () => {
  if (!navigator.geolocation) { setStatus('Geolocation not supported by this browser.'); return; }
  setStatus('Getting your location…');
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLoc = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      map.setView([userLoc.lat, userLoc.lon], 15);
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.marker([userLoc.lat, userLoc.lon], {icon:userIcon}).addTo(map).bindPopup('You are here');
      document.getElementById('btn-scan').disabled = false;
      setStatus('Location found. Pick a radius and scan.');
    },
    err => setStatus('Could not get location: ' + err.message),
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

/* ---------- STEP 2: OVERPASS SCAN ---------- */
document.getElementById('btn-scan').addEventListener('click', async () => {
  if (!userLoc) return;
  const radius = document.getElementById('radius').value;
  setStatus('Searching OpenStreetMap for shops…');
  document.getElementById('btn-scan').disabled = true;

  const query = `
    [out:json][timeout:25];
    (
      node["shop"="butcher"](around:${radius},${userLoc.lat},${userLoc.lon});
      way["shop"="butcher"](around:${radius},${userLoc.lat},${userLoc.lon});
      node["shop"="poultry"](around:${radius},${userLoc.lat},${userLoc.lon});
      way["shop"="poultry"](around:${radius},${userLoc.lat},${userLoc.lon});
      node["name"~"${NAME_MATCH}",i](around:${radius},${userLoc.lat},${userLoc.lon});
      way["name"~"${NAME_MATCH}",i](around:${radius},${userLoc.lat},${userLoc.lon});
    );
    out center tags;
  `;

  try {
    const res = await fetch(OVERPASS_URL, { method: 'POST', body: query });
    if (!res.ok) throw new Error('Overpass returned ' + res.status);
    const data = await res.json();
    processResults(data.elements);
  } catch (e) {
    setStatus('Search failed (' + e.message + '). The free Overpass server is sometimes busy — try again in a moment.');
  } finally {
    document.getElementById('btn-scan').disabled = false;
  }
});

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function processResults(elements) {
  // clear old markers
  shopMarkers.forEach(m => map.removeLayer(m));
  shopMarkers = [];
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  document.getElementById('route-summary').classList.remove('show');

  shops = elements.map(el => {
    const lat = el.lat ?? el.center?.lat;
    const lon = el.lon ?? el.center?.lon;
    const name = el.tags?.name || 'Unnamed shop';
    const addr = [el.tags?.['addr:street'], el.tags?.['addr:city']].filter(Boolean).join(', ');
    const dist = haversine(userLoc.lat, userLoc.lon, lat, lon);
    return { id: el.id, name, addr, lat, lon, dist };
  }).filter(s => s.lat && s.lon)
    .sort((a,b) => a.dist - b.dist);

  // dedupe near-identical entries (same name within ~25m)
  const deduped = [];
  shops.forEach(s => {
    const dupe = deduped.find(d => d.name === s.name && haversine(d.lat,d.lon,s.lat,s.lon) < 25);
    if (!dupe) deduped.push(s);
  });
  shops = deduped;

  renderList();
  shops.forEach(s => {
    const m = L.marker([s.lat, s.lon], {icon: shopIcon}).addTo(map)
      .bindPopup(`<b>${s.name}</b><br>${Math.round(s.dist)} m away`);
    shopMarkers.push(m);
  });

  setStatus(shops.length ? `Found ${shops.length} shop(s). Select the ones to visit, then optimize.` :
    'No matches found in this radius. Try a larger radius — OSM coverage varies by area.');
  document.getElementById('btn-route').disabled = shops.length === 0;
}

function renderList() {
  const list = document.getElementById('shop-list');
  if (!shops.length) { list.innerHTML = '<div class="empty">No shops found in this area.</div>'; return; }
  list.innerHTML = shops.map((s, i) => `
    <label class="shop-row">
      <input type="checkbox" data-idx="${i}" ${i < 10 ? 'checked' : ''}>
      <div>
        <div class="shop-name">${s.name}</div>
        <div class="shop-meta">${s.addr || 'No address in OSM data'}</div>
      </div>
      <div class="shop-dist">${Math.round(s.dist)} m</div>
    </label>
  `).join('');
}

/* ---------- STEP 3: OPTIMIZE ROUTE (OSRM Trip service) ---------- */
document.getElementById('btn-route').addEventListener('click', async () => {
  const checked = [...document.querySelectorAll('#shop-list input:checked')].map(cb => shops[cb.dataset.idx]);
  if (checked.length === 0) { setStatus('Select at least one shop first.'); return; }
  if (checked.length > 20) { setStatus('Pick 20 or fewer stops for the free routing service.'); return; }

  setStatus('Calculating optimized route…');
  document.getElementById('btn-route').disabled = true;

  const coords = [[userLoc.lon, userLoc.lat], ...checked.map(s => [s.lon, s.lat])];
  const coordStr = coords.map(c => c.join(',')).join(';');
  const url = `${OSRM_TRIP_URL}${coordStr}?source=first&roundtrip=false&overview=full&geometries=geojson`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data.code !== 'Ok') throw new Error(data.message || data.code);

    const trip = data.trips[0];
    const order = data.waypoints
      .map((wp, i) => ({ i, order: wp.waypoint_index }))
      .sort((a,b) => a.order - b.order)
      .map(o => o.i)
      .filter(i => i !== 0);           // drop the starting point (index 0 = you)
    const orderedShops = order.map(i => checked[i - 1]);

    if (routeLine) map.removeLayer(routeLine);
    const latlngs = trip.geometry.coordinates.map(c => [c[1], c[0]]);
    routeLine = L.polyline(latlngs, { color: '#4FC3D9', weight: 5 }).addTo(map);
    map.fitBounds(routeLine.getBounds(), { padding: [30,30] });

    document.getElementById('rt-dist').textContent = (trip.distance/1000).toFixed(1) + ' km';
    document.getElementById('rt-time').textContent = Math.round(trip.duration/60) + ' min';
    document.getElementById('route-stops').innerHTML = orderedShops.map(s => `<li>${s.name} <span style="color:var(--text-mid)">(${Math.round(s.dist)} m from start)</span></li>`).join('');
    document.getElementById('route-summary').classList.add('show');

    const dest = orderedShops[orderedShops.length - 1];
    const waypoints = orderedShops.slice(0, -1).map(s => `${s.lat},${s.lon}`).join('|');
    let gmaps = `https://www.google.com/maps/dir/?api=1&origin=${userLoc.lat},${userLoc.lon}&destination=${dest.lat},${dest.lon}&travelmode=driving`;
    if (waypoints) gmaps += `&waypoints=${encodeURIComponent(waypoints)}`;
    document.getElementById('gmaps-link').href = gmaps;

    setStatus('Route ready — ' + orderedShops.length + ' stops.');
  } catch (e) {
    setStatus('Routing failed (' + e.message + '). Try fewer stops or try again shortly.');
  } finally {
    document.getElementById('btn-route').disabled = false;
  }
});
</script>
</body>
  
</html>
